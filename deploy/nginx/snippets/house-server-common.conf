# Installed to /etc/nginx/snippets/house-server-common.conf. Included in every app server block.
server_tokens off;
client_max_body_size 25m;
client_body_timeout 30s;
include /etc/nginx/snippets/house-security-headers.conf;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript
    application/xml application/rss+xml application/manifest+json image/svg+xml font/ttf font/otf;
