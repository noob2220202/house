# Installed to /etc/nginx/snippets/house-tls-params.conf. TLS settings without a certificate
# (Mozilla "intermediate" profile), shared by house-tls.conf (the main certificate) and every
# 사무소 홈페이지 server in /etc/nginx/house/sites/ (one certificate per office, deploy/sites.sh).
# (Let's Encrypt no longer runs OCSP, so no stapling.)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:house_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
