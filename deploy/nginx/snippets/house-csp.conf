# Installed to /etc/nginx/snippets/house-csp.conf (web + admin pages).
# Intentionally sends no header: the Content-Security-Policy of the pages comes from the apps
# themselves, because only they know what each page needs.
#   - User site: apps/web/csp.mjs (sent by apps/web/next.config.mjs headers()). The pages are
#     ISR/static, so no nonce: inline scripts allowed, every external script/frame host pinned.
#   - Admin: apps/admin/src/lib/security/csp.ts (sent by apps/admin/src/middleware.ts) with a
#     per-request script nonce + 'strict-dynamic'.
# Do not add a second Content-Security-Policy here: browsers enforce every policy they receive,
# so an extra header could only block more (e.g. the admin's nonce'd scripts) — never allow more.
# /media keeps its own sandbox policy (house-media.conf).
