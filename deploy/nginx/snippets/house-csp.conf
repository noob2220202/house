# Installed to /etc/nginx/snippets/house-csp.conf (web + admin pages).
# PLACEHOLDER policy, sent as Report-Only until the real frontends are built and tested:
# Naver Maps JS v3 (oapi.map.naver.com + *.pstatic.net tiles), YouTube embeds, data:/blob: images.
# When the frontends are final, tighten it and rename the header to Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://oapi.map.naver.com https://*.map.naver.net https://*.pstatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.pstatic.net https://*.map.naver.net https://*.naver.com https://*.kakaocdn.net https://*.googleusercontent.com https://i.ytimg.com; font-src 'self' data:; connect-src 'self' https://*.map.naver.com https://*.map.naver.net https://naveropenapi.apigw.ntruss.com https://maps.apigw.ntruss.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
