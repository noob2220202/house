<!doctype html>
<!--
  Template of apps/web/public/og-default.png (default Open Graph / Twitter image, 1200×630).
  Brand values mirror apps/web/src/config/brand.ts and the mark of packages/ui/src/brand/BrandMark.tsx.
  Re-render after a rebrand (from the repo root):
    node tools/design-shot.mjs apps/web/tools/og-default.html 1200 apps/web/public/og-default.png 630
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>OG default</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Sans+KR:wght@500;700;800;900&display=swap"
    />
    <style>
      :root {
        --brand: #1d4ff2;
        --brand-soft: #eaf0ff;
        --ink: #0f1b3a;
        --text-2: #3d4866;
        --line: #e3e8f2;
        --accent: #e9d7a8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
      }
      body {
        position: relative;
        font-family: 'Inter', 'Noto Sans KR', sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .map {
        position: absolute;
        right: -60px;
        top: -40px;
        width: 620px;
        height: 710px;
      }
      .content {
        position: absolute;
        left: 88px;
        top: 84px;
        width: 620px;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .word {
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 40px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      h1 {
        margin-top: 64px;
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 58px;
        line-height: 1.22;
        font-weight: 900;
        letter-spacing: -0.045em;
      }
      h1 b {
        color: var(--brand);
      }
      p {
        margin-top: 22px;
        font-size: 24px;
        font-weight: 500;
        color: var(--text-2);
        letter-spacing: -0.02em;
      }
      .chips {
        position: absolute;
        left: 88px;
        bottom: 72px;
        display: flex;
        gap: 10px;
      }
      .chips span {
        height: 44px;
        padding: 0 20px;
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        border: 1.5px solid var(--line);
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 19px;
        font-weight: 700;
        color: var(--text-2);
        background: #fff;
      }
      .chips span.on {
        border-color: var(--brand);
        background: var(--brand);
        color: #fff;
      }
      .pill {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        background: #fff;
        box-shadow:
          0 1px 2px rgba(15, 27, 58, 0.08),
          0 8px 24px rgba(15, 27, 58, 0.12);
        font-family: 'Inter', 'Noto Sans KR', sans-serif;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .pill i {
        font-style: normal;
        font-size: 15px;
        font-weight: 800;
        color: #fff;
        background: var(--brand);
        border-radius: 999px;
        padding: 3px 9px;
      }
      .pill.dark {
        background: var(--ink);
        color: #fff;
      }
      .pill.dark i {
        background: var(--accent);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <svg class="map" viewBox="0 0 620 710" aria-hidden="true">
        <defs>
          <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="1" />
            <stop offset="0.32" stop-color="#fff" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path
          d="M150 90 C 260 40, 420 60, 520 130 C 610 190, 640 320, 600 430 C 560 540, 470 640, 330 660 C 210 676, 120 600, 90 500 C 60 400, 60 160, 150 90 Z"
          fill="#eaf0ff"
        />
        <path
          d="M210 170 C 300 140, 420 160, 480 230 C 540 300, 540 400, 480 470 C 420 540, 320 560, 250 520 C 180 480, 150 380, 160 300 C 166 240, 180 190, 210 170 Z"
          fill="#dbe5ff"
        />
        <path
          d="M110 360 C 220 330, 330 380, 400 330 S 560 250, 640 300"
          fill="none"
          stroke="#bccdff"
          stroke-width="10"
          stroke-linecap="round"
        />
        <path
          d="M300 80 C 320 200, 280 300, 330 420 S 380 600, 360 700"
          fill="none"
          stroke="#ffffff"
          stroke-width="14"
          stroke-linecap="round"
        />
        <ellipse cx="420" cy="420" rx="70" ry="40" fill="#c9d8ff" />
        <rect width="620" height="710" fill="url(#fade)" />
      </svg>
      <span class="pill" style="left: 760px; top: 168px">4억 4,500 <i>3곳</i></span>
      <span class="pill dark" style="left: 900px; top: 300px">분양권 4억 1,900 <i>P</i></span>
      <span class="pill" style="left: 800px; top: 430px">500/42 <i>4곳</i></span>

      <div class="content">
        <div class="lockup">
          <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="9" fill="#1D4FF2" />
            <path
              d="M9 24v-7a7 7 0 0 1 14 0v7"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="3"
              stroke-linecap="round"
            />
            <rect x="13.6" y="17.6" width="4.8" height="6.4" rx="1.2" fill="#FFFFFF" />
            <rect x="21.6" y="6" width="4.4" height="4.4" rx="1.3" fill="#E9D7A8" />
          </svg>
          <span class="word">순천부동산</span>
        </div>
        <h1>순천 공인중개사들이<br />함께 올리는 <b>공동중개 매물</b></h1>
        <p>실매물 확인 · 지도 검색 · 내놓기 · 구하기</p>
      </div>
      <div class="chips">
        <span class="on">아파트·분양권</span>
        <span>원룸·투룸</span>
        <span>주택</span>
        <span>상업·업무</span>
        <span>토지</span>
      </div>
    </div>
  </body>
</html>
