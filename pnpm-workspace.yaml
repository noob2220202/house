packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency lifecycle scripts by default; allow only what needs native/engine setup.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@node-rs/argon2'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver
